name: Build TV Sales APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: ''   # <-- ВОТ ЭТО ГЛАВНОЕ. Пустая строка = ничего лишнего не ставить

    # Этот шаг вручную устанавливает Gradle 8.9, чтобы точно совпало с AGP 8.5.2
    - name: Setup Gradle 8.9
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: tv-sales-debug-apk
        path: app/build/outputs/apk/debug/*.apk
